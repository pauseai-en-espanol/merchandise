# The image tag is written by the release workflow (.github/workflows/release.yml), with yq, which drops blank lines:
# keep this file without them. Everything environment-specific (registry, analytics snippet) lives in the gitops
# values, which shouldn't set image.tag.
replicaCount: 1
image:
  repository: pauseai-es-merchandise-static
  # <version>.<short sha>; "latest" until the first release.
  tag: 1.1.2.2ea6b1e
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
# HTML snippet injected before </head> via nginx sub_filter.
# Set from GitOps values, e.g.:
#   headSnippet: '<script defer data-domain="pauseai.es" src="https://plausible.example.com/js/plausible.js"></script>'
headSnippet: ''
# Nginx 301 redirects, e.g. if the base path ever changes.
# Each entry generates a `location = <from> { return 301 <to>; }` block.
# Set `prefix: true` to also redirect subpaths.
redirects: []
