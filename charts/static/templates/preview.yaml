{{- if .Values.preview.enabled }}
# The preview server (packages/preview): share links' pages and their link
# previews, drawn on request. Same image as the site, its own Deployment, so a
# problem here never takes the site down: nginx falls back to the static share
# pages (see nginx-config.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pauseai-es-merchandise-static.previewName" . }}
  labels:
    {{- include "pauseai-es-merchandise-static.previewLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pauseai-es-merchandise-static.previewSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pauseai-es-merchandise-static.previewSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: preview
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/preview/server.mjs"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.preview.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pauseai-es-merchandise-static.previewName" . }}
  labels:
    {{- include "pauseai-es-merchandise-static.previewLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pauseai-es-merchandise-static.previewSelectorLabels" . | nindent 4 }}
{{- end }}
