<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PauseAI Merchandise</title>
    <meta
      name="description"
      content="Design your PauseAI t-shirt and download print-ready files."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/en/" />
    <link rel="alternate" hreflang="es" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/en/" />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" />
    <link rel="icon" type="image/svg+xml" href="../../../brand/logos/pauseai-es-mark.svg" />

    <!-- Social previews (Open Graph, X/Twitter). Images: pnpm og -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PauseAI" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="%VITE_SITE_URL%/en/" />
    <meta property="og:title" content="PauseAI Merchandise" />
    <meta
      property="og:description"
      content="Design your PauseAI t-shirt and download print-ready files."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PauseAI t-shirts with designs about AI." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PauseAI Merchandise" />
    <meta
      name="twitter:description"
      content="Design your PauseAI t-shirt and download print-ready files."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-en.png" />
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('pauseai-merch') || '{}').theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
