<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Crea tu camiseta de PauseAI y descarga los archivos para imprimirla."
    />
    <link rel="icon" type="image/svg+xml" href="../../brand/logos/pauseai-es-mark.svg" />
    <title>Camisetas PauseAI</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('pauseai-merch') || '{}').theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
