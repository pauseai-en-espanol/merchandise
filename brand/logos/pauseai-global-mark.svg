<!--
  PauseAI — circular brand mark, global version (no wordmark).

  For icon-sized contexts: favicons, social profile pictures, small
  chest prints, app icons. The white ellipse behind the orange mark
  ensures the P-stem cutouts always show white, even when this SVG is
  placed on a colored background.

  For the PauseAI en Español chapter equivalent (with the chapter-
  specific curvy smile detail in place of the ellipse), see
  `pauseai-es-mark.svg`.

  Source: PauseAI Global "Logo Circle White.svg".

  DO NOT edit colors or paths in this file. To add new variants, copy
  to a new file and document it in `brand/logos/README.md`.
-->
